name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create or update from the selected ref, for example v1.4.5
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ github.sha }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CS2BotImprover*
          merge-multiple: true
          path: artifacts
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/CS2BotImprover.zip
            artifacts/CS2BotImprover_rules_unchanged.zip
            artifacts/CS2BotImprover_for_Linux.zip
          fail_on_unmatched_files: true
