name: Convert Panel to submodule

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Replace Panel with the Apple-Style-GUI submodule
        run: |
          git checkout -b panel-submodule
          git rm -r Panel
          git submodule add https://github.com/ed0ard/Apple-Style-GUI.git Panel
          git config -f .gitmodules submodule.Panel.branch main
          git add .gitmodules Panel
          git commit -m "Convert Panel into the Apple-Style-GUI submodule"

      - name: Push branch and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force -u origin panel-submodule
          if [ -z "$(gh pr list --head panel-submodule --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head panel-submodule \
              --title "Convert Panel to the Apple-Style-GUI submodule" \
              --body "Replaces the vendored Panel/ folder with a git submodule that points at https://github.com/ed0ard/Apple-Style-GUI (branch main)."
          fi
