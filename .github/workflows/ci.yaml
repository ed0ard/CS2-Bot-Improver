name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: .build-dependencies/downloads
          key: build-dependencies-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-dependencies-${{ runner.os }}-
      - name: Build Linux native components in SteamRT3
        if: matrix.platform == 'linux'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest \
            python3 build/build.py --native-only --platform linux \
              --output .build-dependencies/native/linux
      - name: Build Windows packages
        if: matrix.platform == 'windows'
        run: python build/build.py --platform windows
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build Linux package
        if: matrix.platform == 'linux'
        run: python build/build.py --platform linux --native-packages .build-dependencies/native
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload Windows package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: CS2BotImprover
          path: artifacts/CS2BotImprover.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload Windows rules-unchanged package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: CS2BotImprover_rules_unchanged
          path: artifacts/CS2BotImprover_rules_unchanged.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload Linux package
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: CS2BotImprover_for_Linux
          path: artifacts/CS2BotImprover_for_Linux.zip
          if-no-files-found: error
          compression-level: 0
